map $http_upgrade $centrifugo_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name ~^ws\.;

    location = /connection/websocket {
        resolver 127.0.0.11 valid=10s;
        set $centrifugo_backend http://centrifugo:8000;
        proxy_pass $centrifugo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $centrifugo_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/sab/public;
    index index.php index.html;
    charset utf-8;

    # Permitir el cuerpo multipart hasta el post_max_size de PHP.
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 600;
    }

    location ~ /\. {
        deny all;
    }
}
