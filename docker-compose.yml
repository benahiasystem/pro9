name: sab

services:
  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    container_name: sab-centrifugo
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_HTTP_API_KEY: "${CENTRIFUGO_API_KEY:?Define CENTRIFUGO_API_KEY in .env}"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:?Define CENTRIFUGO_TOKEN_HMAC_SECRET_KEY in .env}"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: '${CENTRIFUGO_ALLOWED_ORIGINS:-http://*.localhost}'
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ######## INICIO API BCV ########
  api-bcv:
    build:
      context: ../api-bcv
    image: sab-api-bcv
    container_name: sab-api-bcv
    env_file:
      - ../api-bcv/.env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - bcv
    restart: unless-stopped
  # ######## FIN API BCV ########

  nginx:
    container_name: sab-nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/sab:ro
    depends_on:
      centrifugo:
        condition: service_healthy
      php:
        condition: service_healthy
    restart: unless-stopped

  php:
    # Conserva la base PHP local y habilita GD con soporte nativo para AVIF.
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    image: sab-php-avif
    container_name: sab-php
    working_dir: /var/www/sab
    # ######## INICIO RED PRIVADA BCV ########
    networks:
      - default
      - bcv
    # ######## FIN RED PRIVADA BCV ########
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - ./:/var/www/sab
      - ./docker/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mysql:
    container_name: sab-mysql
    image: mysql:5.7.33
    # ######## INICIO PUBLICACIÓN MYSQL PARA MYSQL WORKBENCH ########
    ports:
      - "3306:3306"
    # ######## FIN PUBLICACIÓN MYSQL PARA MYSQL WORKBENCH ########
    environment:
      MYSQL_DATABASE: tenancy
      MYSQL_ROOT_PASSWORD: admin.root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -padmin.root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    container_name: sab-redis
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

# ######## INICIO RED PRIVADA BCV ########
networks:
  default:
  bcv:
    driver: bridge
# ######## FIN RED PRIVADA BCV ########
