# ########## INICIO CAMBIO POSTGRESQL 17
name: pro9-postgresql
services:
  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_HTTP_API_KEY: "${CENTRIFUGO_API_KEY:?Define CENTRIFUGO_API_KEY in .env}"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:?Define CENTRIFUGO_TOKEN_HMAC_SECRET_KEY in .env}"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: '${CENTRIFUGO_ALLOWED_ORIGINS:-http://*.localhost}'
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api-bcv:
    build:
      context: ${API_BCV_PATH:-../api-bcv}
    image: pro9-api-bcv
    env_file:
      - ${API_BCV_PATH:-../api-bcv}/.env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks: [bcv]
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8089}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/pro9:ro
    depends_on:
      centrifugo:
        condition: service_healthy
      php:
        condition: service_healthy
    restart: unless-stopped
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    image: pro9-postgres-php:17.11
    platform: linux/amd64
    working_dir: /var/www/pro9
    networks: [default, bcv]
    env_file: ["${PRO9_APP_ENV_FILE:-.env}"]
    environment:
      DB_CONNECTION: system
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./:/var/www/pro9
      - ./docker/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres:
    image: supabase/postgres:17.11.0.019@sha256:eca9f664ced0c453ae499e75bb503283831c94f2eef69fc2e69bf86f70278ddc
    platform: linux/amd64
    shm_size: 256mb
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD:?Defina la clave de inicialización PostgreSQL}
      DB_DATABASE: ${DB_DATABASE:-pro9}
      DB_USERNAME: ${DB_USERNAME:-pro9_runtime}
      DB_PASSWORD: ${DB_PASSWORD:?Defina la clave de operación central}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME:-pro9_owner}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Defina la clave del propietario central}
      DB_PROVISIONER_USERNAME: ${DB_PROVISIONER_USERNAME:-pro9_provisioner}
      DB_PROVISIONER_PASSWORD: ${DB_PROVISIONER_PASSWORD:?Defina la clave del aprovisionador}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_config:/etc/postgresql-custom
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/99-pro9.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/pro9-bootstrap-complete && pg_isready -h 127.0.0.1 -U supabase_admin -d postgres && PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -U \"$$DB_USERNAME\" -d \"$$DB_DATABASE\" -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
volumes:
  postgres_data:
  postgres_config:
  redis_data:
networks:
  default:
  bcv:
    driver: bridge
# ######### FIN CAMBIO POSTGRESQL 17
