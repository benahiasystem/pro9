name: PostgreSQL 17.11
on:
  push:
    branches: [codex/postgresql-supabase-17-11, prod]
  pull_request:
    paths: ['app/**', 'modules/**', 'database/**', 'config/**', 'resources/**', 'public/build/**', 'public/porto-ecommerce/assets/js/**', 'vite.config.js', 'package*.json', 'tests/**', 'scripts/**', 'docker/**', 'docker-compose*.yml', 'composer.*']
jobs:
  temporary-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: docker build -t sab-postgres-php:17.11 -f docker/php.Dockerfile .
      - run: docker run --rm -v "$PWD:/var/www/sab" -w /var/www/sab sab-postgres-php:17.11 composer install --no-interaction --prefer-dist --no-scripts
      - run: docker build --target testing -t sab-postgres-php-test:17.11 -f docker/php.Dockerfile .
      - run: npm ci --ignore-scripts
      - run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - run: php tests/Infrastructure/postgres_compose_probe.php
      - run: php tests/Infrastructure/postgres_compose_probe.php --recovery
      - run: php scripts/test_postgresql.php --skip-build --without-pos-performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-17-evidence
          path: informes/evidencias/postgresql_17_implementacion/
